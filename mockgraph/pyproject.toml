[project]
name = "calendar-sync-mockgraph"
version = "0.1.0"
description = "Local stand-in for the Microsoft identity platform and Microsoft Graph, for developing and testing Calendar Sync. Never use it in production."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "pyjwt>=2.15",
    "tzlocal>=5.4",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockgraph"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]  # line length is enforced by `ruff format`

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC109", "ASYNC110"]  # polling a running stack with a deadline is the point
