name: calendar-sync

# The backend and the database run on Supabase (`supabase start` locally, a hosted project
# in production). Compose only runs the web app and, for development, the mock Microsoft
# identity platform + Graph.

services:
  web:
    build:
      context: ./frontend
      args:
        # Where the Next.js server proxies /api/* and /auth/* (the Supabase Edge Functions).
        SUPABASE_FUNCTIONS_URL: ${SUPABASE_FUNCTIONS_URL:-http://host.docker.internal:54321/functions/v1}
    image: calendar-sync-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Local stand-in for login.microsoftonline.com + graph.microsoft.com.
  # Enabled with COMPOSE_PROFILES=mock (the default in .env.example). The Edge Functions
  # reach it at http://host.docker.internal:8001, and it delivers webhooks to the
  # functions through the same host gateway.
  mockgraph:
    build: ./mockgraph
    image: calendar-sync-mockgraph:local
    profiles: ["mock"]
    environment:
      SOURCE_APP_CLIENT_ID: ${SOURCE_APP_CLIENT_ID}
      SOURCE_APP_CLIENT_SECRET: ${SOURCE_APP_CLIENT_SECRET}
      MOCKGRAPH_STATE_FILE: /data/mockgraph.pickle
    volumes:
      - mockdata:/data
    ports:
      - "${MOCKGRAPH_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # A second, throwaway mock for the automated tests (`make test`): no persisted state,
  # reset before every test.
  mockgraph-test:
    image: calendar-sync-mockgraph:local
    profiles: ["test"]
    environment:
      SOURCE_APP_CLIENT_ID: 22222222-2222-4222-8222-222222222222
      SOURCE_APP_CLIENT_SECRET: mock-source-secret
    ports:
      - "8002:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mockdata:
